name: Verify MergeWitness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: pip install -r requirements.txt
      - run: genvm-lint check contracts/merge_witness.py --json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/gltest-direct/genvm-universal-v0.2.16.tar.xz
          key: genvm-direct-v0.2.16-4f0b358e
      - name: Pin the GenVM bundle used by direct mode
        run: |
          bundle="$HOME/.cache/gltest-direct/genvm-universal-v0.2.16.tar.xz"
          mkdir -p "$(dirname "$bundle")"
          if [ ! -f "$bundle" ]; then
            curl --fail --location --retry 3 https://github.com/genlayerlabs/genvm/releases/download/v0.2.16/genvm-universal.tar.xz -o "$bundle"
          fi
          echo "4f0b358ec98ec148be9b95cdfb0f0e1a6cbe64da0194fdfac3fffc6f5d1d93e2  $bundle" | sha256sum --check
      - run: python -m pytest -q
